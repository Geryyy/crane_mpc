# Type, validation and one line of what each parameter is. **No values**: they
# live in `config/crane_mpc.yaml` alone (issue 183), so nothing here can ship a
# second controller. A key that file omits is refused at startup by name
# (`ParameterUninitializedException`) rather than running a default nobody chose.
#
# Provenance -- sweeps, measured tables, the essays that used to sit here -- is in
# the issue notes that recorded each number: 119, 121, 137, 156, 174.
crane_mpc:
  mode:
    type: string
    description: "`shadow` leaves /crane/mpc/horizon silent and publishes ~/shadow_horizon
      plus ~/shadow_comparison; `active` drives the contract topic. Not read_only -- which
      command path is live is the supervisor's call, and a switch cold-starts the next solve."
    validation:
      one_of<>: [["shadow", "active"]]

  start_signal_action:
    type: string
    read_only: true
    description: "FollowJointTrajectory action whose accepted goal releases this node to
      drive; empty means /crane/reference arriving *is* the go signal. Read off that action's
      `<name>/_action/status`, no action client."

  jtc_name:
    type: string
    read_only: true
    description: "The JTC that plays the horizon. Its update_rate (0: the manager's) is read
      at configuration and must match velocity_loop.yaml rate_hz, or the node refuses."

  Ts:
    type: double
    read_only: true
    description: "T_s, s -- control cycle, horizon knot spacing, publication period and the
      whole transport dead time. `config.check_settings` refuses a T_s that is not
      `sensor_to_valve_delay` or not a whole number of velocity_loop.yaml ticks."
    validation:
      gt<>: [0.0]

  sensor_to_valve_delay:
    type: double
    read_only: true
    description: "Transport dead time x_0 is carried forward by before solving, s. **Must
      equal T_s** -- the delay is rolled as one interval. Modelled here only: crane_model's
      symbolic.py carries no delay, so a second one would double-count."
    validation:
      gt<>: [0.0]

  dq_a_feedback:
    type: bool_array
    read_only: true
    description: "Per actuated axis: true takes x_0's velocity row from /joint_states, false
      from the model's own propagation. Positions and both passive rows are always measured;
      the tool row is inert. read_only -- flipping mid-move steps that row of x_0."
    validation:
      fixed_size<>: [6]

  dq_a_divergence_max:
    type: double_array
    read_only: true
    description: "Model-carried vs measured velocity gap that gets reported, per axis, rad/s
      (m/s telescope): warned and published on ~/shadow_comparison. **Nothing is corrected.**"
    validation:
      fixed_size<>: [6]
      lower_element_bounds<>: [0.0]

  solve_budget:
    type: double
    description: "Budget, s, from the /joint_states sample to the solved horizon -- end to
      end, not acados' solve_time. The solve is **not interrupted** at it: over budget comes
      back as SOLVE_BUDGET_EXCEEDED and the previous horizon shifted one step goes out."
    validation:
      gt<>: [0.0]

  solver_health_decimation:
    type: int
    description: "Solves per /crane/mpc/solver_health report. A change of verdict is exempt,
      a standing one is not."
    validation:
      gt_eq<>: [1]

  max_consecutive_failures:
    type: int
    read_only: true
    description: "Consecutive non-converged solves before escalation stops the publisher.
      Each fallback shifts the previous horizon up one knot and duplicates the last stage, so
      at horizon_length-1 the whole horizon is one stale knot; the node warns at startup."
    validation:
      gt_eq<>: [1]

  max_state_age:
    type: double
    read_only: true
    description: "Oldest measured state still solved from, s. Also bounds
      /crane/controller_state: one deadline, because the two streams are joined at that
      instant."
    validation:
      gt<>: [0.0]

  levenberg_marquardt:
    type: double
    read_only: true
    description: "Regularisation on the Gauss-Newton Hessian, added identically every cycle.
      Not a trust region and it does not latch."
    validation:
      gt_eq<>: [0.0]

  command_state:
    type: bool
    read_only: true
    description: "C4: the joint-velocity command c becomes 5 states appended to x and u[:5]
      becomes its rate dc, bounded by limits.du_max and priced by weights.du. False is C3
      exactly. Compiled in: a different export."

  sway:
    dq_u_settled:
      type: double_array
      read_only: true
      description: "Sway rate below which the load is called settled, per passive row
        [tip, tilt], rad/s. Rate and not angle -- the published angle carries an uncalibrated
        offset. **Instantaneous**: no dwell, so a swinging load reads SETTLED_YES at its
        turning points and a consumer gating a grip owes itself the dwell."
      validation:
        fixed_size<>: [2]
        lower_element_bounds<>: [0.0]

  weights:
    q_a:
      type: double_array
      read_only: true
      description: "Q -- actuated position tracking, diagonal of a weighted norm."
      validation:
        fixed_size<>: [6]
        lower_element_bounds<>: [0.0]
    dq_a:
      type: double_array
      read_only: true
      description: "Q_dot_a -- actuated velocity tracking."
      validation:
        fixed_size<>: [6]
        lower_element_bounds<>: [0.0]
    q_u:
      type: double_array
      read_only: true
      description: "Q_u -- sway offset, per passive row, against the q_eq cycle.py freezes at
        the measured passive position. The hanging pose moves 1:1 with -(q_boom + q_arm), so
        **this prices luffing, not swinging**; the centre is issue 049's."
      validation:
        fixed_size<>: [2]
        lower_element_bounds<>: [0.0]
    dq_u:
      type: double_array
      read_only: true
      description: "Q_dot_u -- sway rate, and the sway term that ships: a rate residual needs
        no centre, so it survives the frozen q_eq that q_u could not."
      validation:
        fixed_size<>: [2]
        lower_element_bounds<>: [0.0]
    tau_a:
      type: double_array
      read_only: true
      description: "R_tau -- effort, pricing **tau_a and never u** and against h_eff rather
        than zero, so an acceleration costs its effective inertia and the optimizer buys no
        droop. Small because tau_a runs to 1e4-1e5 N m while the tracking residuals are rad."
      validation:
        fixed_size<>: [6]
        lower_element_bounds<>: [0.0]
    u:
      type: double_array
      read_only: true
      description: "R -- smoothness on the input. `u` is a **velocity** here, which is what
        the progress weights were derived against; the rows move together or not at all."
      validation:
        fixed_size<>: [6]
        lower_element_bounds<>: [0.0]
    du:
      type: double_array
      read_only: true
      description: "w_du -- move suppression. Under C3 it is stage 0 only, w_du*(u_0 - u_f)^2
        against the command in flight, folded into the u row so no re-export. Under
        command_state (C4) it prices the rate dc, in (rad/s^2)^-2, on every stage."
      validation:
        fixed_size<>: [6]
        lower_element_bounds<>: [0.0]
    lag:
      type: double
      read_only: true
      description: "w_lag -- tracking error projected on the reference's direction of travel,
        **slewing joint only** and **unnormalised**, so it absorbs the reference speed's
        scale. Marc's `weights.weight_lag` reproduced, not generalised to mixed units."
      validation:
        gt_eq<>: [0.0]
    tool:
      type: double
      read_only: true
      description: "Q -- the tool's own distance from the path, in metres. Position only.
        Zero is the purely joint-space cost that shipped before this row existed."
      validation:
        gt_eq<>: [0.0]
    progress:
      type: double
      read_only: true
      description: "w_s -- the path parameter against the end of the path. The progress state
        *is* the path parameter, so this is the whole price on getting anywhere: at zero the
        machine sits on the path forever rather than travelling it."
      validation:
        gt<>: [0.0]
    progress_rate:
      type: double
      read_only: true
      description: "w_sDot -- the path parameter's rate, priced toward rest. Damping and not a
        regulator; may be zero, the limits still bound the rate."
      validation:
        gt_eq<>: [0.0]
    progress_accel:
      type: double
      read_only: true
      description: "Smoothness on the sixth input, progress acceleration. A regulariser, not
        a tuning surface."
      validation:
        gt_eq<>: [0.0]
    terminal_scale:
      type: double
      read_only: true
      description: "Factor the terminal weights are raised over the stage ones. The terminal
        cost is the stage cost without the input-dependent terms, and it is a cost and never a
        terminal *set*: a hard terminal set is a dependable source of infeasibility here."
      validation:
        gt_eq<>: [0.0]

  limits:
    # Constraint 1's box (q_a_lower/q_a_upper/q_a_margin), constraint 2's dq_a_max and
    # constraint 5's u_max are **not declared**: crane_model owns the first four in
    # config/control_safe_limits.yaml with the provenance per number, and
    # `config.command_domain` derives u_max as min(Psi's identified domain, dq_a_max) so it
    # keeps narrowing when either factor narrows. A declaration here would be the second
    # copy issue 128 had to repair. Same for `hydraulics.*`: `crane_model.hydraulic_limits()`
    # is the only reader (issue 183 deleted the overrides, which made the export stale).
    q_u_max:
      type: double_array
      read_only: true
      description: "Constraint 3, |q_u - q_eq| <= q_u^+ -- tool swing clearance, drawn around
        the **equilibrium** and never around zero: the hanging pose moves with the arm. Same
        number the planner clears the path for."
      validation:
        fixed_size<>: [2]
        lower_element_bounds<>: [0.0]
    dq_u_max:
      type: double_array
      read_only: true
      description: "Constraint 4, |dq_u| <= dq_u^+. **Hand-set controller bounds, not physical
        limits** -- the joints are unactuated and these express how much sway is tolerated."
      validation:
        fixed_size<>: [2]
        lower_element_bounds<>: [0.0]
    progress_rate_headroom:
      type: double
      read_only: true
      description: "Ceiling of the progress rate, as a multiple of the plan's own pace.
        **Dimensionless on purpose**: `s` is a path parameter, so an absolute rate silently
        changed meaning with horizon_length and Ts. The floor is a structural zero -- the
        machine does not run the plan backwards -- and is not a parameter."
      validation:
        gt_eq<>: [1.0]
        lt_eq<>: [10.0]
    progress_accel_max:
      type: double
      read_only: true
      description: "|a_s| <= this, 1/s. At zero the progress rate is frozen at whatever it was
        carried in with and the progress state is decoration."
      validation:
        gt<>: [0.0]
    du_max:
      type: double_array
      read_only: true
      description: "C4 only: |dc| <= this per planned axis, rad/s^2 (m/s^2 telescope). Unread
        under C3."
      validation:
        fixed_size<>: [5]
        lower_element_bounds<>: [0.0]

  slack:
    q_u:
      type: double_array
      read_only: true
      description: "L1 slack price on constraint 3. Constraints 3, 4, 6 and 7 are soft
        because a measurement transient can otherwise make the problem infeasible for a state
        the machine is already in. Every soft row is a **fraction of its own allowance**, so
        the four prices compare directly. Zero is refused."
      validation:
        fixed_size<>: [2]
        lower_element_bounds<>: [0.0]
    dq_u:
      type: double_array
      read_only: true
      description: "L1 slack price on constraint 4, sway rate. Same scale and reason as q_u."
      validation:
        fixed_size<>: [2]
        lower_element_bounds<>: [0.0]
    cylinder_force:
      type: double_array
      read_only: true
      description: "L1 slack price on constraint 6, per actuated row. **Dearest of the four,
        deliberately**: the prediction assumes the inner loop tracks its velocity command,
        which holds only while it has force authority, so a plan spending force slack is a
        plan about a machine that does not exist."
      validation:
        fixed_size<>: [6]
        lower_element_bounds<>: [0.0]
    pump_flow:
      type: double
      read_only: true
      description: "L1 slack price on constraint 7, priced with constraint 6: behaviour *at*
        the pump limit is the load-sensing hardware's, not a plan's. Soft only because the
        draw at stage 0 is fixed by the measured dq_a and no input can relieve it."
      validation:
        gt<>: [0.0]

  horizon_length:
    type: int
    read_only: true
    description: "N, knots. Sized by the sway period -- of order 2 s, **never computed** -- so
      that the optimizer cannot excite an oscillation developing after the horizon ends. N T_s
      is also the fault-tolerance budget: that many missed solves before the receiver's
      buffer runs dry."
    validation:
      bounds<>: [2, 120]

  max_reference_age:
    type: double
    read_only: true
    description: "How long after a plan has **ended** this node keeps publishing, s, measured
      from the end of the reference and not its stamp. Past the end the horizon holds the goal
      at zero velocity; after that the node publishes **nothing**, so the receiver runs its
      expiry ramp -- which a publisher still emitting a dead plan would defeat."
    validation:
      gt<>: [0.0]

  min_progress_rate:
    type: double
    read_only: true
    description: "Realized progress rate below which a cycle counts as not progressing, as a
      fraction of nominal. Wall clock, unlike max_reference_age's plan time: a rate of zero is
      feasible, so a stalled machine never ages out on that clock."
    validation:
      gt<>: [0.0]
      lt<>: [1.0]

  max_stall_time:
    type: double
    read_only: true
    description: "How long the rate may stay under min_progress_rate before it is reported,
      **s of wall clock**. Bound is on *sustained* near-zero progress: one cycle at or above
      the rate clears the count. **A report, not a recovery** -- the horizon keeps going out
      and SolverHealth carries it in `message` alone."
    validation:
      gt<>: [0.0]

  max_clock_skew:
    type: double
    read_only: true
    description: "How far ahead of this node's clock a reference's stamp may be and still be
      used, s; a lead inside it is treated as zero, a larger one stops the publisher. **Also
      bounds /crane/controller_state's stamp**, which is shadow mode's comparison instant."
    validation:
      gt<>: [0.0]
