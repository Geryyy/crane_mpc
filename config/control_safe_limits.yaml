# Where every number in `crane_mpc.yaml`'s `limits` comes from (issues 126, 128,
# ported onto this lineage by issue 141).
#
# **Not loaded by anything.** This is the record `crane_mpc_parameters.yaml`
# cites for `q_a_lower`, `q_a_upper` and `dq_a_max`, and it exists because the
# box had drifted back into being a copy of the description: before 128 the two
# position rows were the URDF's own limits, on the boom by 0.0158 rad of
# configurations the four-bar cannot reach.
#
# Rows are in the actuated order of wiki/nomenclature.md §4: q1 slewing, q2 boom,
# q3 arm, q4 telescope, q7 rotator, q8 tool. Angles in rad and rad/s, telescope
# and tool in m and m/s.

sources:
  marc_hpp: "timber_crane_model_cpp/include/timber_crane_model_cpp/joint_limits.hpp:14-30
    -- what his MPC's joint-limit constraint reads"
  marc_yaml: "epsilon_crane_bringup_mp/config/motion_planning/mp_parameter_pzs100.yaml:135-224
    -- deployed; `qMinCtrl`/`qMaxCtrl`/`qDotMinCtrl`/`qDotMaxCtrl`, whose naming *is*
    the control-safe-versus-description distinction"
  urdf: "epsilon_crane_description/urdf/joints/theta*.urdf.xacro -- the description"
  stroke: "wiki/hydraulics.md §5.3, the vendor stroke table; §2.2 and §2.3 for the
    transmissions that turn a stroke into a joint angle"
  psi: "wiki/implementation/compensator_map.md §3 -- Psi's identified domain"

# `marc_hpp` and `marc_yaml` agree to the digit on every crane row, which is what
# makes these measured rather than inferred. The attribution is clean: his PZS100
# and timber configs differ in three lines, all of them the tool joint.
q_a_lower:
  slewing:
    value: -3.71
    source: [marc_hpp, marc_yaml, urdf]
    check: "rack and pinion, one-to-one (§2.1); no stroke limit is tabulated, so
      travel is the only bound and the description already carries it"
  boom:
    value: 0.0
    source: [marc_hpp, marc_yaml]
    check: "**changed by 128**, was the urdf's -1.2. The four-bar stops closing at
      q2 = -1.1841609 (delta < 0 below it, §2.2) and the ratio is negative on
      (-1.18416, -1.15096), reaching -6.1. s2 >= 1.253 m gives q2 >= -1.054, so the
      stroke limit alone excluded all of it. 0.0 sits 1.18 rad clear; s2(0) = 1.609 m"
  arm:
    value: -0.91
    source: [marc_hpp, marc_yaml]
    check: "s3(-0.91) = 1.2468 m against s_min = 1.244 m -- stroke-feasible by
      2.8 mm, the tightest margin in this file. The stroke limit itself implies
      q3 >= -0.9217"
  telescope:
    value: 0.0
    source: [marc_hpp, marc_yaml, urdf]
    check: "s4 = q4 (§2.4); fully retracted is the stroke bound. The machine parks
      here, which is why q_a_margin may never exclude the measured pose"
  rotator:
    value: -12.566370614359172
    source: [marc_hpp, marc_yaml]
    check: "-4pi. A motor, no piston and no stroke (§2.5); the bound is turn
      counting, not geometry. Already Marc's and never the urdf's"
  tool:
    value: 0.2
    source: []
    check: "unresolved. His tool row is an angle on a [0, 3] joint -- a retired jaw
      gripper -- and does not compare. The PZS100 rail travels 0.0..0.538 m (§2.6)"

q_a_upper:
  slewing: {value: 3.71, source: [marc_hpp, marc_yaml, urdf], check: "see q_a_lower"}
  boom:
    value: 1.563
    source: [urdf]
    check: "the description's, 0.001 rad above Marc's 1.562 and left alone: 128's
      direction is inward and this is not the end that was wrong. s2(1.563) =
      2.2113 m against s_max = 2.229 m, so it is stroke-feasible either way"
  arm:
    value: 1.324864
    source: [marc_hpp, marc_yaml]
    check: "issue 126. 0.52 rad below the transmission dead point at q3 = 1.8466647,
      where constraint 6's extend and retract bounds would swap. s3 = 2.1131 m,
      inside s_max = 2.172 m. Was the urdf's 4.6"
  telescope: {value: 2.236, source: [marc_hpp, marc_yaml, urdf], check: "see q_a_lower"}
  rotator: {value: 12.566370614359172, source: [marc_hpp, marc_yaml], check: "+4pi"}
  tool:
    value: 0.7
    source: []
    check: "**above the rail's 0.538 m travel** (§2.6) and unresolved with the lower:
      which coordinate row 5 carries is not settled, so 128 did not narrow a number
      it cannot attribute. Worth an issue"

# Constraint 2 is one magnitude per axis; his box is asymmetric. Each row is the
# smaller of his two, so the narrowing is inward on both sides. Before 128 the
# rows took the larger, which is how the boom came to allow 36 % and the telescope
# 58 % more extension than the deployed controller does.
dq_a_max:
  slewing: {value: 0.764, source: [marc_yaml], check: "his -0.764 / +0.802; was 0.802"}
  boom: {value: 0.239067, source: [marc_yaml], check: "his -0.325963 / +0.239067; was 0.326"}
  arm: {value: 0.325733, source: [marc_yaml], check: "his -0.343547 / +0.325733; was 0.344"}
  telescope: {value: 0.400000, source: [marc_yaml], check: "his -0.630189 / +0.400000; was 0.630"}
  rotator: {value: 2.121947, source: [marc_yaml], check: "symmetric there already"}
  tool: {value: 0.5, source: [], check: "hand-set; no counterpart, his tool is PID'd
    outside the MPC"}

# The two derived rows, recorded so the derivation does not get lost.
derived:
  u_max: "min(psi domain, dq_a_max) per axis. After 128 only the arm is bound by
    the domain (0.3059 against 0.325733); the other four are bound by dq_a_max"
  q_a_margin: "dq_a_max times the 60 ms transport dead time -- but the **pre-128**
    dq_a_max, and deliberately not recomputed: a smaller margin widens the
    effective box"

# Two things this record is the right place to say out loud.
known_gaps:
  planner_box: "crane_planning reads its box off the description
    (crane_planning/config.py:108-110), so since issues 126 and 128 it certifies
    boom and arm poses constraint 1 hard-refuses -- boom below 0.02 rad, arm above
    1.3039 (the bound less that row's own q_a_margin). Out of 128's scope by
    instruction; needs its own issue"
  engagement_band: "there is no `position_box` equivalent on the velocity rows.
    Between the two sides of Marc's asymmetric box -- boom 0.239..0.326 rad/s
    lowering, telescope 0.400..0.630 m/s retracting -- the machine may legally be
    moving faster than the MPC's own stage-1 bound, so engaging there asks the
    first interval to brake. Taking the looser side instead is what this change
    refuses; the alternative is a two-sided constraint 2"
