# Hydraulic limits for the MPC. Pump rows mirror
# crane_model/config/hydraulics.yaml's `pump` block, pinned by
# test_parameters_are_declared; crane_planning shares it.
crane_mpc:
  ros__parameters:
    hydraulics:
      pump_flow_max: 1.4e-3

      pump_flow_planning_factor: 0.95

      system_pressure_pa: 2.5e7
