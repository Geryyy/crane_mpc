crane_mpc:
  ros__parameters:
    # Issue 305 fallback (b): the shipped C3, move suppression x7.8 instead. The one
    # lever that needs no new model on the machine -- but it is a weight and not a
    # plant, so it buys calm at some mismatches and not at others (304 critic3).
    # The only variant that needs no export: the weights are deliberately outside
    # export_key -- they go in through the runtime API every cycle.
    ocp_actuator_fit: ""  # explicit: b is the shipped identification, whatever the default becomes
    weights:
      du: [32.0, 32.0, 32.0, 32.0, 32.0, 32.0]  # 4.1 shipped
      # 305's bench: rings on 13 of 91 moves against the shipped 30 -- a reduction,
      # not a fix. On the bare loaded slew calm at plant x1, x2 and x12, ringing at
      # x3 (1.23 /cycle) and x4 (1.18). du_max is then ridden on 8-9 % of cycles
      # against the candidate's 82 %, so the command stays inside its rate bound.
